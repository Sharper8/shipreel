name: ShipReel

# Reusable workflow: records a demo video of the app on the PR head (and on the
# base branch, for before/after), publishes mp4s to a rolling release in the
# CALLING repo, and upserts a sticky PR comment with the links.
#
# Contract: the caller's walkthrough command drives a real browser through the
# app, drops one or more .webm recordings into <video-dir>, and exits non-zero
# if any screen raised. ShipReel owns everything else (conversion, publishing,
# commenting). See README.md.

on:
  workflow_call:
    inputs:
      setup-command:
        description: "Shell commands to install app deps + the walkthrough's own deps (e.g. playwright)"
        required: true
        type: string
      walkthrough-command:
        description: "Shell command that runs the walkthrough; must drop .webm files into <video-dir> and exit non-zero on failure"
        required: true
        type: string
      video-dir:
        description: "Directory the walkthrough writes .webm recordings into"
        default: "e2e/videos"
        type: string
      before-after:
        description: "Also record the walkthrough on the PR base branch and post before/after + side-by-side videos"
        default: true
        type: boolean
      release-tag:
        description: "Rolling release tag that hosts the videos (created if missing)"
        default: "shipreel-videos"
        type: string
      python-version:
        description: "Python version for setup-python (harmless for non-Python apps)"
        default: "3.11"
        type: string

jobs:
  shipreel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup (caller-provided)
        run: ${{ inputs.setup-command }}

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record AFTER video (PR head)
        id: after
        env:
          VIDEO_DIR: ${{ inputs.video-dir }}
        run: |
          mkdir -p shipreel-out
          rm -rf "$VIDEO_DIR" && mkdir -p "$VIDEO_DIR"
          ${{ inputs.walkthrough-command }}
          src=$(ls "$VIDEO_DIR"/*.webm | head -1)
          ffmpeg -y -i "$src" -c:v libx264 -pix_fmt yuv420p -movflags +faststart shipreel-out/after.mp4
          ffmpeg -y -i shipreel-out/after.mp4 -vf "fps=10,scale=720:-1:flags=lanczos" shipreel-out/after.gif

      - name: Record BEFORE video (base branch)
        if: inputs.before-after && github.event_name == 'pull_request'
        id: before
        continue-on-error: true  # a broken base must not block the PR
        env:
          VIDEO_DIR: ${{ inputs.video-dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.email shipreel@local && git config user.name shipreel
          # Base app code, but the walkthrough harness from the PR head
          # (the harness may not exist on base yet).
          git checkout -q "$BASE_SHA"
          git checkout -q "$HEAD_SHA" -- e2e/ 2>/dev/null || true
          rm -rf "$VIDEO_DIR" && mkdir -p "$VIDEO_DIR"
          ${{ inputs.walkthrough-command }}
          src=$(ls "$VIDEO_DIR"/*.webm | head -1)
          ffmpeg -y -i "$src" -c:v libx264 -pix_fmt yuv420p -movflags +faststart shipreel-out/before.mp4
          ffmpeg -y -i shipreel-out/before.mp4 -vf "fps=10,scale=720:-1:flags=lanczos" shipreel-out/before.gif

      - name: Side-by-side combined video
        if: steps.before.outcome == 'success'
        run: |
          ffmpeg -y -i shipreel-out/before.mp4 -i shipreel-out/after.mp4 \
            -filter_complex "[0:v][1:v]hstack=inputs=2[v]" -map "[v]" -shortest \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart shipreel-out/combined.mp4

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipreel
          path: |
            shipreel-out/
            ${{ inputs.video-dir }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish videos to rolling release
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ inputs.release-tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "${{ github.event.repository.default_branch }}" \
              --title "ShipReel videos (rolling)" \
              --notes "Auto-generated PR demo videos. Assets are overwritten per PR — always the latest run."
          for f in shipreel-out/*.mp4 shipreel-out/*.gif; do
            [ -e "$f" ] || continue
            staged="/tmp/pr-${PR_NUMBER}-$(basename "$f")"
            cp "$f" "$staged"
            gh release upload "$TAG" "$staged" --clobber
          done

      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ inputs.release-tag }}
          HAS_BEFORE: ${{ steps.before.outcome }}
        run: |
          MARKER="<!-- shipreel -->"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          if [ "$JOB_STATUS" = "success" ]; then
            LINES="✅ Walkthrough passed — no screen raised."
            [ -f "shipreel-out/combined.mp4" ] && \
              LINES="${LINES}\n\n**⏯ Before/after side-by-side:** ${BASE_URL}/pr-${PR_NUMBER}-combined.mp4"
            LINES="${LINES}\n\n**After (this PR):** ${BASE_URL}/pr-${PR_NUMBER}-after.mp4"
            [ "$HAS_BEFORE" = "success" ] && \
              LINES="${LINES}\n**Before (base):** ${BASE_URL}/pr-${PR_NUMBER}-before.mp4"
          else
            LINES="🔴 Walkthrough FAILED — recording up to the failure + \`FAILURE-<screen>.png\` screenshot are in the run artifacts (\`shipreel\`)."
          fi
          BODY=$(printf "%b\n🎬 **ShipReel — PR demo video**\n\n%b\n" "$MARKER" "$LINES")
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi
          echo "comment upserted"
